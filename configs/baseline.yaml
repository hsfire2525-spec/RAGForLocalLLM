# ベースライン。IPAガイドライン（PDF）＋ LM Studio。
#
# **これが以降のすべての比較の基準点になる**（docs/design/design.md §8 Phase 2）。
# 手法を追加するときは、この設定から1軸だけ変えた差分設定を `extends: baseline`
# で作り、`rag report` で対応のある比較を行う。
#
# 実行前に LM Studio でモデルをロードしておくこと:
#   uv run rag env -c baseline     # サーバ上のモデルIDを確認
#   uv run rag eval -c baseline
#
# LLM を使わない下限（語彙一致のみ）と比べたい場合は configs/ipa_draft.yaml。
name: baseline
corpus: data/corpus/ipa_sme_guideline_v4.0.pdf

index:
  # 既定値は汎用。ここでの上書きはすべて当コーパスの実測に基づく
  # （観察の詳細は stages/loader/pdf.py の冒頭と docs/design/design.md §9）。
  loader:
    type: pymupdf
    # 表紙(1)・白紙(2)・目次(3-4)。目次はリーダー線と見出しの重複で
    # 検索ノイズにしかならない。
    skip_pages: [1, 2, 3, 4]
    # フォントの ToUnicode 誤りで箇条書き記号が「●Ө」として抽出される
    replacements: {"●Ө": "・"}
    # 図中ラベルが 3.4〜4.4pt で本文行に割り込み、文を分断する。
    # 本文は 8.5pt 以上なので 5.0 で切れる。
    min_font_size: 5.0
    # 「コラム」だけの見出しスタブを落とす（本文を持たない装飾ラベル）
    min_section_chars: 16
  chunker: {type: recursive_ja, chunk_size: 512, overlap: 64}
  embedder:
    type: sentence_transformers
    # `query: ` / `passage: ` のプレフィックス規約は実装側が持つ。
    # 設定に露出させると付け忘れが起き、例外は出ないまま精度だけ落ちる。
    model: intfloat/multilingual-e5-base
  # 全探索（近似なし）。数万チャンク規模では十分速く、近似の取りこぼしが
  # 手法比較に混入しない。
  indexer: {type: faiss, metric: cosine, factory: flat}

query:
  query_transform: {type: normalize}
  retriever: {type: dense, top_k: 5}
  post_retrieval:
    # 出典をチャンク本文に添える。引用の検証と人手検査の両方で効く。
    - {type: add_section_path}
  prompt:
    type: template
    path: prompts/basic_ja.jinja
    # 4B級・4bit量子化では名目コンテキスト長に達する前に品質が劣化する。
    # 件数ではなくトークン予算で制御する。
    context_token_budget: 1536
    overflow_policy: drop_lowest
    instruction_placement: system
  generator:
    type: openai_compat
    base_url: http://localhost:1234/v1
    # LM Studio 側にロード済みのモデルIDを指定する（`rag env -c baseline` で確認可）。
    # QAT版（gemma-4-e4b-it-qat）と agents-a1-4b は入手後に Phase 3 のモデル軸で比較する。
    model: gemma-4-e4b-it
    temperature: 0.0
    seed: 42
    max_tokens: 512
  post_generation:
    - {type: parse_citations}
    - {type: abstain_on_phrase}

eval:
  dataset: data/gold/qa_v2.jsonl
  metrics:
    - recall@5
    - mrr
    - gold_quote_resolvability
    - answer_char_f1
    - citation_validity
    - abstention
    - latency
