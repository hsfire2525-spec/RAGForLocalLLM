[project]
name = "ragforlocalllm"
version = "0.1.0"
description = "性能の低いローカルLLMでも回答精度を最大化するための実験用RAGフレームワーク"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# 検索: FAISS / BM25
retrieval = [
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
]
# 日本語処理: 形態素解析（BM25・単語F1用）
ja = [
    "sudachipy>=0.6.8",
    "sudachidict-core>=20240409",
]
# PDF抽出
pdf = [
    "pymupdf>=1.24",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
]
# 埋め込み・リランク・NLI（ローカルモデル直実行）
models = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
# 社内共有のWeb UI。ローカル完結（外部CDNを使わない）
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# LM Studio 等の OpenAI 互換サーバ
llm = [
    "httpx>=0.27",
]

[project.scripts]
rag = "ragforlocalllm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragforlocalllm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # 全角括弧などを含む日本語文字列を許可
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# 型スタブのない外部ライブラリ
[[tool.mypy.overrides]]
module = ["faiss.*", "rank_bm25.*", "sudachipy.*", "fitz.*", "pdfplumber.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# モデルのダウンロードや実サーバを要するテストは既定で除外する。
# 実験の反復中に走らせたいのは、決定的で速いものだけ。
addopts = "-q -m 'not slow'"
markers = [
    "slow: モデルのダウンロードや実LLMを要する。`uv run pytest -m slow` で実行",
]
